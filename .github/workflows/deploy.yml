name: Publicar FinanzasPWA en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Instalar dependencias
        run: npm ci
      - name: Generar iconos de la PWA
        run: npm run generate-pwa-assets
      - name: Compilar para la subruta del repositorio
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
