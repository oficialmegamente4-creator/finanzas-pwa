name: Publicar FinanzasPWA en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Instalar dependencias
        run: npm ci
      - name: Generar iconos de la PWA
        run: npm run generate-pwa-assets
      - name: Validar configuración segura de Supabase
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Configura VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY en Actions Variables antes de publicar."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" != https://* ]]; then
            echo "::error::VITE_SUPABASE_URL debe usar HTTPS."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::Solo se permite una clave sb_publishable_; nunca configures sb_secret_ ni service_role."
            exit 1
          fi
      - name: Compilar para la subruta del repositorio
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
